name: Check ldconfig cache

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check-ldconfig:
    name: Check ldconfig cache up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Fetch
        run: |
          for i in $(seq 10); do
            bazel --bazelrc=$GITHUB_WORKSPACE/.github/workflows/ci.bazelrc fetch --keep_going //python3:check_ldconfig_tests && break
            [[ $i -eq 10 ]] && exit 1
            sleep 30
          done

      - name: Check ldconfig caches
        run: bazel --bazelrc=$GITHUB_WORKSPACE/.github/workflows/ci.bazelrc test //python3:check_ldconfig_tests
