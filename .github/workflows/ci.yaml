name: CI

on:
  workflow_dispatch: # Allow manual runs.
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lockfile:
    name: Check lockfile up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check lockfile
        run: bazel mod deps --lockfile_mode=error

  ci-build-test:
    name: CI build and unit test
    runs-on: distroless-ci-large-ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Restore bazel cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel-repo
          key: bazel-cache-deps-${{ hashFiles('.bazelversion') }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-cache-deps-${{ hashFiles('.bazelversion') }}-

      - name: Fetch # this can take a long time if there are a lot of errors
        run: |
          for i in $(seq 10); do
            bazel --bazelrc=$GITHUB_WORKSPACE/.github/workflows/ci.bazelrc fetch --keep_going //... && break
            [[ $i -eq 10 ]] && exit 1
            sleep 180
          done

      - name: Save bazel cache
        if: ${{ github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel-repo
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build All Images
        run: |
          set -euo pipefail
          RC="--bazelrc=$GITHUB_WORKSPACE/.github/workflows/ci.bazelrc"
          targets=$(bazel "$RC" query 'kind(oci_image, deps(//:sign_and_push))')
          bazel "$RC" build //:sign_and_push $targets
      - name: Unit Tests
        run: bazel --bazelrc=$GITHUB_WORKSPACE/.github/workflows/ci.bazelrc test //... --build_tests_only
      - name: Build Examples
        run: bazel --bazelrc=$GITHUB_WORKSPACE/.github/workflows/ci.bazelrc build //examples/...

  ci-images:
    name: CI image tests
    runs-on: distroless-ci-large-ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Restore bazel cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel-repo
          key: bazel-cache-deps-${{ hashFiles('.bazelversion') }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-cache-deps-${{ hashFiles('.bazelversion') }}-

      - name: Fetch
        run: |
          for i in $(seq 20); do
            bazel --bazelrc=$GITHUB_WORKSPACE/.github/workflows/ci.bazelrc cquery --keep_going 'attr(tags, "amd64", ...)' && break
            [[ $i -eq 20 ]] && exit 1
            sleep 10
          done

      - name: Image Tests
        run: bazel --bazelrc=$GITHUB_WORKSPACE/.github/workflows/ci.bazelrc test $(bazel query 'attr(tags, "amd64", ...)')
