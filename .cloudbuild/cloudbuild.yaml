timeout: 10800s  # 3 hours

options:
  machineType: E2_HIGHCPU_32
  logging: CLOUD_LOGGING_ONLY

artifacts:
  objects:
    location: 'gs://${_ARTIFACTS_GCS_}/logs'
    paths: ['.logs/*.log']

steps:
  - name: mirror.gcr.io/library/buildpack-deps:trixie@sha256:8db3a3d1e68e0a88ed31c2256d0c0e3b127f80685e6b1f3a9bb31e22638b5e7b
    env:
      - PROJECT_ID=${PROJECT_ID}
      - COMMIT_SHA=${COMMIT_SHA}
      - REGISTRY=gcr.io
      - REMOTE_CACHE_GCS=${_REMOTE_CACHE_GCS_}
      - KEYLESS=keyless@${PROJECT_ID}.iam.gserviceaccount.com
    entrypoint: bash
    args: [".cloudbuild/release.sh"]
